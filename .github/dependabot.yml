# Weekly version updates. Minor and patch bumps are grouped into one PR and
# auto-merged by .github/workflows/dependabot-automerge.yml once required CI is
# green; major bumps arrive as separate PRs labelled `major-update`.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directories:
  - /
  - /docs
  - /editors/vscode
  - /wares-site
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  # @types/vscode must not exceed engines.vscode (^1.75.0) in editors/vscode,
  # or `vsce package` refuses to build the extension.
  - dependency-name: "@types/vscode"
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  # bincode 3.0.0 is an upstream tombstone release (lib.rs is just
  # compile_error!("https://xkcd.com/2347/")); we use bincode 2 (legacy config).
  - dependency-name: bincode
    versions:
    - ">=3"
