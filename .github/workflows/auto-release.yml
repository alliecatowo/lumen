name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      # Compare the [workspace.package] version before and after this push, not any
      # `+version =` line in the diff.
      - name: Get current and previous version
        id: version
        run: |
          read_version() { python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["workspace"]["package"]["version"])'; }
          NEW="$(read_version < Cargo.toml)"
          OLD="$(git show HEAD~1:Cargo.toml | read_version || echo none)"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "previous=$OLD" >> "$GITHUB_OUTPUT"

      - name: Check if version changed
        id: check
        run: |
          if [ "${{ steps.version.outputs.version }}" != "${{ steps.version.outputs.previous }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  create-tag:
    name: Create Release Tag
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
            # Tags pushed with GITHUB_TOKEN do not trigger the tag-based Release
            # workflow, so start it explicitly on the new tag. release.yml waits for
            # CI on this commit and refuses to ship if CI is red. The same goes for
            # publish.yml (crates.io, npm; OIDC trusted publishing), so dispatch it too.
            gh workflow run release.yml --ref "$TAG"
            gh workflow run publish.yml --ref "$TAG" -f target=all
          fi
