# =============================================================================
# Lumen CI Pipeline
# =============================================================================
#
# CI requirements (all jobs must pass for merge to main):
#
#   1. check       — `cargo check --workspace` on Linux, macOS, Windows.
#                    Also checks lumen-wasm compiles for wasm32-unknown-unknown.
#   2. test        — `cargo test --workspace` on Linux, macOS, Windows.
#   3. fmt         — `cargo fmt --all -- --check` enforces consistent formatting.
#   4. clippy      — `cargo clippy --workspace -- -D warnings` enforces zero
#                    clippy warnings across all crates. Any new warning is a
#                    build failure.
#   5. examples    — Type-checks all examples/*.lm.md files with release build.
#   6. lang-ref    — Verifies `lumen lang-ref` generates without errors.
#   7. diag-latency-gate — LSP diagnostic latency benchmark must stay under
#                    the p95 threshold (currently 8ms, 120 iterations).
#
# Adding a new CI job:
#   - Add a new job below following the existing pattern.
#   - Use dtolnay/rust-toolchain@stable and Swatinem/rust-cache@v2.
#   - Document the job's purpose in this header block.
#
# =============================================================================

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing in CI writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Compilation check (cross-platform)
  # ---------------------------------------------------------------------------
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --workspace
      - run: cargo check --manifest-path rust/lumen-wasm/Cargo.toml --target wasm32-unknown-unknown

  # ---------------------------------------------------------------------------
  # Test suite (cross-platform)
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Formatting (rustfmt)
  # ---------------------------------------------------------------------------
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # Lint (clippy) — zero warnings policy
  # ---------------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace -- -D warnings

  # ---------------------------------------------------------------------------
  # Example programs type-check
  # ---------------------------------------------------------------------------
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release
      - run: |
          failed=0
          for f in examples/*.lm.md; do
            echo "Checking $f..."
            cargo run --release --bin lumen -- check "$f" || failed=1
          done
          exit $failed

  # ---------------------------------------------------------------------------
  # Language reference generation
  # ---------------------------------------------------------------------------
  lang-ref:
    name: Language Reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify lang-ref generates
        run: cargo run --release --bin lumen -- lang-ref > /dev/null

  # ---------------------------------------------------------------------------
  # LSP diagnostic latency gate (performance regression check)
  # ---------------------------------------------------------------------------
  diag-latency-gate:
    name: LSP Diag Latency Gate
    runs-on: ubuntu-latest
    env:
      LUMEN_DIAG_BENCH_ITERATIONS: "120"
      LUMEN_DIAG_BENCH_WARMUP_ITERATIONS: "20"
      LUMEN_DIAG_BENCH_THRESHOLD_METRIC: "p95"
      LUMEN_DIAG_BENCH_THRESHOLD_MS: "8.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo run -p lumen-lsp --bin diag_latency_bench

  # ---------------------------------------------------------------------------
  # Dependency advisories (RUSTSEC). Vulnerabilities fail the job; unmaintained
  # or unsound warnings (bincode, memmap2) are reported but allowed.
  # ---------------------------------------------------------------------------
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # ---------------------------------------------------------------------------
  # VS Code extension type-check (Dependabot majors have broken tsc before)
  # ---------------------------------------------------------------------------
  vscode-extension:
    name: VS Code Extension (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: node --test test/

  # ---------------------------------------------------------------------------
  # Cloudflare worker unit tests (run before deploy-workers.yml can ship them)
  # ---------------------------------------------------------------------------
  workers:
    name: Workers (${{ matrix.worker }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [registry, transparency-log]
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json
      - run: npm ci
      - run: npm test

  # ---------------------------------------------------------------------------
  # Installer script: shellcheck plus an end-to-end test against a fake release
  # (checksum verification, tampering, 404s, cleanup)
  # ---------------------------------------------------------------------------
  install-script:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck --severity=warning scripts/install.sh scripts/tests/install_test.sh scripts/bump-version.sh
      - run: sh scripts/tests/install_test.sh
