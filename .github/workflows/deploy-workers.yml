name: Deploy Workers

# Deploys only run when a Cloudflare token is configured, after the worker unit
# tests pass. Keep CLOUDFLARE_API_TOKEN as a secret of the `workers-deploy`
# environment (add required reviewers there to gate production deploys).
on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  test:
    name: Test ${{ matrix.worker }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [registry, transparency-log]
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy ${{ matrix.worker }}
    needs: test
    runs-on: ubuntu-latest
    environment: workers-deploy
    strategy:
      # Deploy the log first: the registry binds to it as a service.
      max-parallel: 1
      matrix:
        worker: [transparency-log, registry]
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip when the Cloudflare token is not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy of ${{ matrix.worker }}"
      - if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node
      # wrangler comes from the worker's own lockfile instead of an unpinned global install.
      - name: Install dependencies
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm ci
      - name: Deploy ${{ matrix.worker }}
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
