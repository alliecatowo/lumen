name: Publish Ecosystem

on:
  push:
    tags:
      - 'v*'
  # v0.5.0 is already tagged (and tags pushed by auto-release with GITHUB_TOKEN
  # do not trigger workflows), so the first crates.io publish is a manual run:
  #   gh workflow run publish.yml -R alliecatowo/lumen
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-rust:
    name: Publish Rust Crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      # Publishes every non-private workspace crate in dependency order and
      # waits for the index between crates. Already-published versions are an
      # error, so re-runs after a partial failure need the failed crate only.
      - name: Publish workspace crates to crates.io
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish NPM Packages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Publish tree-sitter-lumen
        run: |
          cd tree-sitter-lumen
          npm publish --provenance --access public
        # NODE_AUTH_TOKEN not required if "Trusted Publishing" is configured on npmjs.com

      - name: Build and Publish lumen-wasm
        run: |
          cd rust/lumen-wasm
          wasm-pack build --target bundler
          cd pkg
          npm publish --provenance --access public
