name: Release
on:
  push:
    tags:
      - 'v*'
  # Tags pushed by auto-release.yml with GITHUB_TOKEN do not trigger tag
  # workflows, so auto-release dispatches this workflow on the new tag instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Never ship binaries from a commit whose CI is red. Waits (up to 60 minutes)
  # for the CI workflow on this exact commit and fails unless it succeeded.
  gate:
    name: CI must be green
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "pull_request")] | sort_by(.created_at) | reverse')"
            status="$(jq -r '.[0].status // "none"' <<<"$runs")"
            conclusion="$(jq -r '.[0].conclusion // ""' <<<"$runs")"
            echo "CI run for ${SHA}: status=${status} conclusion=${conclusion} (attempt ${attempt})"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then exit 0; fi
              echo "::error::CI did not succeed for ${SHA} (${conclusion}); refusing to release"
              exit 1
            fi
            sleep 30
          done
          echo "::error::timed out waiting for CI on ${SHA}"
          exit 1

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: lumen-linux-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: lumen-linux-x64-musl
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: lumen-linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            name: lumen-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: lumen-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: lumen-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        env:
          OPENSSL_STATIC: 1
          PKG_CONFIG_ALLOW_CROSS: 1
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }} --bin lumen --bin lumen-lsp
          else
            cargo build --locked --release --target ${{ matrix.target }} --bin lumen --bin lumen-lsp
          fi
        shell: bash

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz lumen lumen-lsp

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path lumen.exe,lumen-lsp.exe -DestinationPath ../../../${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      # install.sh verifies downloads against this file.
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./*/lumen-* | sed 's#  [^ ]*/#  #' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*/lumen-*
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            artifacts/*/*
            artifacts/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true

  # Homebrew formula in alliecatowo/homebrew-tap. Renders Formula/lumen.rb from
  # the release's tarballs and pushes it over SSH with a write deploy key
  # (secret HOMEBREW_TAP_DEPLOY_KEY, no PAT). Skipped for pre-release tags.
  update-homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    permissions:
      contents: read
    steps:
      - name: Render and push Formula/lumen.rb
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY secret is not set; cannot update the tap"
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          mkdir assets
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern 'lumen-macos-arm64.tar.gz' --pattern 'lumen-macos-x64.tar.gz' \
            --pattern 'lumen-linux-arm64.tar.gz' --pattern 'lumen-linux-x64-musl.tar.gz'
          sha() { sha256sum "assets/$1.tar.gz" | cut -d' ' -f1; }
          MAC_ARM_SHA="$(sha lumen-macos-arm64)"
          MAC_X86_SHA="$(sha lumen-macos-x64)"
          LINUX_ARM_SHA="$(sha lumen-linux-arm64)"
          LINUX_X86_SHA="$(sha lumen-linux-x64-musl)"

          cat > lumen.rb <<EOF
          # Homebrew formula for lumen. Generated by the update-homebrew job in
          # alliecatowo/lumen (.github/workflows/release.yml) on each stable release. Do not edit by hand.
          class Lumen < Formula
            desc "Markdown-native, statically typed language for deterministic AI-native workflows"
            homepage "https://github.com/alliecatowo/lumen"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/lumen-macos-arm64.tar.gz"
                sha256 "${MAC_ARM_SHA}"
              end
              on_intel do
                url "${base}/lumen-macos-x64.tar.gz"
                sha256 "${MAC_X86_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/lumen-linux-arm64.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              end
              on_intel do
                url "${base}/lumen-linux-x64-musl.tar.gz"
                sha256 "${LINUX_X86_SHA}"
              end
            end

            def install
              bin.install "lumen", "lumen-lsp"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/lumen --version")
            end
          end
          EOF

          install -d -m 700 ~/.ssh
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:alliecatowo/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp lumen.rb tap/Formula/lumen.rb
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "Tap already up to date; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lumen.rb
          git commit -m "lumen ${VERSION}"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
