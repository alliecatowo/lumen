[package]
name = "lumen-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Cranelift JIT / native code generation (the `codegen` module).
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-module",
    "dep:cranelift-native",
    "dep:cranelift-object",
    "dep:cranelift-jit",
    "dep:target-lexicon",
]

[dependencies]
cranelift-codegen = { version = "0.129", optional = true }
cranelift-frontend = { version = "0.129", optional = true }
cranelift-module = { version = "0.129", optional = true }
cranelift-native = { version = "0.129", optional = true }
cranelift-object = { version = "0.129", optional = true }
target-lexicon = { version = "0.13", optional = true }
cranelift-jit = { version = "0.129", features = ["selinux-fix"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
num-bigint = { workspace = true, features = ["serde"] }
num-traits = { workspace = true }

[dev-dependencies]
lumen-runtime = { path = "../lumen-runtime" } # dev-only; path-only so it is dropped on publish (runtime depends on compiler)

[[bench]]
name = "codegen_bench"
harness = false
required-features = ["jit"]
