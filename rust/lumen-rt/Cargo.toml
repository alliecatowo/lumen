[package]
name = "lumen-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
bincode = "1"
crossbeam-deque = "0.8"
crossbeam-channel = "0.5"
num_cpus = "1.16"
# flate2 uses the miniz_oxide pure-Rust backend by default (since 1.0.17),
# so it compiles cleanly on wasm32 without a target-scoped dependency gate.
# No `[target.'cfg(not(target_arch = "wasm32"))'.dependencies]` block is needed.
# The call sites (`compress`, `decompress`, and their callers) are gated with
# `#[cfg(not(target_arch = "wasm32"))]` because wasm builds simply don't use
# gzip compression — not because flate2 itself fails to build on wasm32.
flate2 = "1"

[dev-dependencies]
lumen-provider-crypto = { path = "../lumen-provider-crypto" }
lumen-provider-env = { path = "../lumen-provider-env" }
lumen-provider-fs = { path = "../lumen-provider-fs" }
