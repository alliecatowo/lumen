[package]
name = "lumen-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["jit", "provider-fs", "provider-env", "provider-json", "provider-crypto"]
# Cranelift JIT tier for the VM (enables lumen-compiler's `codegen` module).
jit = ["lumen-compiler/jit"]
# Built-in tool providers (modules under `lumen_runtime::providers`).
provider-fs = []
provider-env = []
provider-json = []
provider-crypto = ["dep:hmac", "dep:md-5", "dep:base64", "dep:rand", "dep:hex", "dep:ed25519-dalek"]
provider-http = ["dep:reqwest"]
provider-gemini = ["dep:reqwest"]
provider-mcp = []
# Everything, including the opt-in network providers.
full = [
    "jit",
    "provider-fs",
    "provider-env",
    "provider-json",
    "provider-crypto",
    "provider-http",
    "provider-gemini",
    "provider-mcp",
]

[dependencies]
lumen-compiler = { path = "../lumen-compiler", version = "0.6.2" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
num-bigint = { workspace = true, features = ["serde"] }
num-traits = { workspace = true }
bincode = { version = "2", default-features = false, features = ["std", "serde"] }
crossbeam-deque = "0.8"
crossbeam-channel = "0.5"
num_cpus = "1.16"
flate2 = "1"
regex = "1"
once_cell = "1"

# Optional provider dependencies
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
hmac = { version = "0.13", optional = true }
md-5 = { version = "0.11", optional = true }
base64 = { version = "0.23", optional = true }
rand = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
ed25519-dalek = { version = "3", features = ["rand_core"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3"

[lints]
workspace = true

[[test]]
name = "mcp_integration_tests"
required-features = ["provider-mcp"]
